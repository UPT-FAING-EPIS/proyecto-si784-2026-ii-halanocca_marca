version: '3.8'

services:
  cloudscope-db:
    image: postgres:16-alpine
    container_name: cloudscope-db
    restart: always
    environment:
      POSTGRES_DB: cloudscope_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cloudscope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudscope_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  cloudscope-backend:
    build:
      context: ./cloudscope-backend
      dockerfile: Dockerfile
    container_name: cloudscope-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=cloudscope-db
      - DB_PORT=5432
      - DB_NAME=cloudscope_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      cloudscope-db:
        condition: service_healthy

  cloudscope-frontend:
    build:
      context: ./cloudscope-frontend
      dockerfile: Dockerfile
    container_name: cloudscope-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - cloudscope-backend
    environment:
      - NODE_ENV=production

volumes:
  cloudscope_pgdata:


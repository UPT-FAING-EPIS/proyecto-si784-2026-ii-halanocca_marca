name: SonarQube analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PR_KEY: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Sonar configuration
        id: sonar-check
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_PROJECT_KEY" ]; then
            echo "has_sonar=true" >> "$GITHUB_OUTPUT"
            echo "✅ Credenciales de SonarQube detectadas. Se ejecutará escaneo en servidor."
          else
            echo "has_sonar=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Secret SONAR_TOKEN no configurado en GitHub. Se ejecutará análisis de calidad estática y generación de reporte local."
          fi
      - run: mvn -B verify
        working-directory: CLOUDSCOPE/cloudscope-backend
      - run: npm ci
        working-directory: CLOUDSCOPE/cloudscope-frontend
      - name: Frontend LCOV
        working-directory: CLOUDSCOPE/cloudscope-frontend
        run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text node --test tests/*.test.js
      - name: Configure analysis identity
        if: steps.sonar-check.outputs.has_sonar == 'true'
        run: |
          python - <<'PY'
          import os
          with open('sonar-project.properties', 'a') as f:
              f.write('\nsonar.projectKey=' + os.environ['SONAR_PROJECT_KEY'] + '\n')
              if os.environ.get('SONAR_ORGANIZATION'):
                  f.write('sonar.organization=' + os.environ['SONAR_ORGANIZATION'] + '\n')
          PY
      - name: Scan and submit analysis
        id: scan
        if: steps.sonar-check.outputs.has_sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: -Dsonar.qualitygate.wait=false
      - name: Previous Sonar evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/security_report.py sonarqube --baseline
      - name: Export bugs vulnerabilities and hotspots
        if: always()
        run: python scripts/sonar_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-sonarqube
          path: reports/sonarqube/
          if-no-files-found: error
          retention-days: 90
      - name: Verify SonarQube report generated
        if: always()
        run: |
          test -f reports/sonarqube/report.md || { echo "❌ No se encontró el reporte reports/sonarqube/report.md"; exit 1; }
          echo "✅ Reporte de SonarQube generado y validado con éxito."
